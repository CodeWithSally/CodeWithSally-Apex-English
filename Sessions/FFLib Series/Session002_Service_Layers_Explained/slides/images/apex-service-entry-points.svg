<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1280 650" role="img" aria-labelledby="service-title">
  <title id="service-title">Every entry point calls the same Apex Service</title>
  <defs>
    <linearGradient id="g-hub" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#A0C94A"/>
      <stop offset="100%" stop-color="#DBFF9C"/>
    </linearGradient>
    <linearGradient id="g-ui" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7F5AAB"/>
      <stop offset="100%" stop-color="#C7AEED"/>
    </linearGradient>
    <linearGradient id="g-soap" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6C55B0"/>
      <stop offset="100%" stop-color="#B8AAF1"/>
    </linearGradient>
    <linearGradient id="g-rest" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5950B8"/>
      <stop offset="100%" stop-color="#A9A6F6"/>
    </linearGradient>
    <linearGradient id="g-invocable" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4A52BE"/>
      <stop offset="100%" stop-color="#A1A5FC"/>
    </linearGradient>
    <linearGradient id="g-agent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#475BB1"/>
      <stop offset="100%" stop-color="#9EA8FE"/>
    </linearGradient>
    <linearGradient id="g-email" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4564C4"/>
      <stop offset="100%" stop-color="#9CAEFF"/>
    </linearGradient>
    <linearGradient id="g-batch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#417BCA"/>
      <stop offset="100%" stop-color="#9ABDFF"/>
    </linearGradient>
    <linearGradient id="g-sched" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3B95D1"/>
      <stop offset="100%" stop-color="#95D1FF"/>
    </linearGradient>
    <linearGradient id="g-queue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#37B3D7"/>
      <stop offset="100%" stop-color="#93EAFF"/>
    </linearGradient>
    <filter id="shape-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

