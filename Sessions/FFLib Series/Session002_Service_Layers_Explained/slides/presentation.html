<h1 id="unit-of-work">Unit of Work</h1>
<ul>
<li data-marpit-fragment="1"><a href="https://martinfowler.com/eaaCatalog/unitOfWork.html">Martin Fowler</a> — <em>Patterns of Enterprise Application Architecture</em>
<ul>
<li data-marpit-fragment="2"><em>“Maintains a list of objects affected by a business transaction and coordinates the writing out of changes and the resolution of concurrency problems.”</em></li>
</ul>
</li>
<li data-marpit-fragment="3">One transaction: work completes or is rolled back explicitly</li>
<li data-marpit-fragment="4">Best practices: automatically bulkifies, runs in user mode</li>
<li data-marpit-fragment="5">Relationships: built in memory without having to insert parent</li>
<li data-marpit-fragment="6"><code>commitWork()</code> takes a savepoint and rolls back if anything fails</li>
<li data-marpit-fragment="7">In Apex that means: register work now, <code>commitWork()</code> once — see <a href="https://andyinthecloud.com/2013/06/09/managing-your-dml-and-transactions-with-a-unit-of-work/">AndyInTheCloud, June 2013</a></li>
</ul>
</section>

<h1 id="service-%E2%9E%A1%EF%B8%8F-task-orientated-logic">Service <img class="emoji" draggable="false" alt="➡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/27a1.svg" data-marp-twemoji=""/> Task Orientated Logic</h1>
<ul>
<li data-marpit-fragment="1">A Service represents a <strong>feature</strong> of the application
<ul>
<li data-marpit-fragment="2">Fulfillment — <code>FulfillmentService.cls</code></li>
<li data-marpit-fragment="3">Dispatch — <code>DispatchService.cls</code></li>
<li data-marpit-fragment="4">Maintenance — <code>MaintenanceService.cls</code></li>
</ul>
</li>
<li data-marpit-fragment="5">Each method is a <strong>task</strong> within that feature — <code>releaseOrders</code>, <code>dispatchWarehouses</code>, <code>completeLines</code></li>
<li data-marpit-fragment="6">Think of it as the <strong>conductor</strong> — the band handles querying and object-specific logic; the Service sets the tempo and the rules of the orchestration</li>
</ul>
<div class="conductor-graphic">
  <img src="images/service-conductor-band.png" alt="A conductor in front of a band — the Service sets the tempo; querying and object-specific logic play behind" />
  <p class="conductor-caption"><span>Tasks in front</span><span>Service — the conductor</span><span>The band — querying and object-specific logic</span></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="detail-slide diagram-slide" data-theme="session" data-lang="en" lang="en" class="detail-slide diagram-slide" data-marpit-pagination="20" style="--paginate:true;--class:detail-slide diagram-slide;--theme:session;--lang:en;" data-marpit-pagination-total="49">
<h1 id="services-have-many-consumers">Services have many Consumers</h1>
<p><img src="images/apex-service-entry-points.svg" alt="Hub and spoke: UI controllers, web and REST services, invocable methods, agent actions, email, batch, scheduled, and queueable all call one Apex Service" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="11" data-paginate="true" data-class="detail-slide promises-slide" data-theme="session" data-lang="en" lang="en" class="detail-slide promises-slide" data-marpit-pagination="21" style="--paginate:true;--class:detail-slide promises-slide;--theme:session;--lang:en;" data-marpit-pagination-total="49">
<h1 id="service-%E2%98%91%EF%B8%8F-checklist">Service <img class="emoji" draggable="false" alt="☑️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2611.svg" data-marp-twemoji=""/> Checklist</h1>
<ul>
<li data-marpit-fragment="1">Client-agnostic inputs and outputs
<ul>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>dispatchWarehouses(Set&lt;Id&gt; warehouseIds)</code></li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>dispatch(DispatchForm form)</code></li>
</ul>
</li>
<li data-marpit-fragment="4">Client-agnostic exceptions
<ul>
<li data-marpit-fragment="5"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>throw DispatchServiceException</code></li>
<li data-marpit-fragment="6"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>throw AuraHandledException</code></li>
</ul>
</li>
<li data-marpit-fragment="7"><strong>Bulkification</strong> — collections in and out; don't force callers to loop
<ul>
<li data-marpit-fragment="8"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>dispatchWarehouses(Set&lt;Id&gt; warehouseIds)</code></li>
<li data-marpit-fragment="9"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <code>dispatchWarehouse(Id warehouseId)</code> only</li>
</ul>
</li>
<li data-marpit-fragment="10"><strong>Transactions</strong> — one UOW; rollback; Service→Service passes the outer uow</li>
<li data-marpit-fragment="11"><strong>Security</strong> — enforce user-mode in DML (UOW) and SOQL (Selector)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="8" data-paginate="true" data-class="detail-slide promises-slide service-evolution-slide" data-theme="session" data-lang="en" lang="en" class="detail-slide promises-slide service-evolution-slide" data-marpit-pagination="22" style="--paginate:true;--class:detail-slide promises-slide service-evolution-slide;--theme:session;--lang:en;" data-marpit-pagination-total="49">
<h1 id="service-%F0%9F%94%81-evolution">Service <img class="emoji" draggable="false" alt="🔁" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f501.svg" data-marp-twemoji=""/> Evolution</h1>
<ul>
<li data-marpit-fragment="1"><strong>Services</strong> — now prefer instance methods over static
<ul>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <code>DispatchService.newInstance().dispatchWarehouses(...)</code> — reduces boilerplate to support mocking, better alignment with Apex Stubs requirements</li>

<h1 id="dispatchservicedispatchwarehouses">DispatchService.dispatchWarehouses</h1>
<div class="vscode">

<div class="vscode-prose">
<p class="walk-sig walk-sig-start"><span class="walk-kw">public virtual void</span> dispatchWarehouses(Set&lt;Id&gt; warehouseIds) {</p>
<ol>
<li><span class="walk-layer walk-layer-service">Service</span> — <code>UnitOfWork.newInstance()</code></li>
<li><span class="walk-layer walk-layer-selector">Selector</span> — pending unassigned lines at the warehouses</li>
<li><span class="walk-layer walk-layer-selector">Selector</span> — idle robots at the warehouses</li>
