<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="scd-title">
  <title id="scd-title">Controller, REST, Invocable, and Trigger call the Service; the Service reuses Domain and Selector</title>
  <defs>
    <filter id="scd-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="scd-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <path d="M 0,0 L 10,4 L 0,8 z" fill="#7BA7D9"/>
    </marker>
    <linearGradient id="scd-tab-client" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0.52" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#5c5c5c" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="scd-tab-service" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0.52" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#A0C94A" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="scd-tab-domain" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0.52" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#5A98E0" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="scd-tab-selector" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0.52" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#E8A84A" stop-opacity="0.58"/>
    </linearGradient>
  </defs>

  <g font-family="'Segoe UI', system-ui, sans-serif">
    <g filter="url(#scd-shadow)">
      <rect x="32" y="24" width="370" height="50" fill="#252526"/>
      <rect x="32" y="24" width="210" height="50" fill="url(#scd-tab-client)"/>
      <rect x="32" y="70" width="210" height="4" fill="#5c5c5c"/>
      <rect x="50" y="38" width="18" height="18" rx="3" fill="#5c5c5c"/>
