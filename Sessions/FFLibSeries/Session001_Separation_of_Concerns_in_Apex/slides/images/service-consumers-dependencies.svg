      <text x="660" y="260" text-anchor="middle" fill="#f4f6f9" font-size="18" font-weight="600">calls</text>
    </g>
    <g>
      <rect x="892" y="236" width="96" height="36" rx="18" fill="#021a38" stroke="#7BA7D9" stroke-width="1.6"/>
      <text x="940" y="260" text-anchor="middle" fill="#f4f6f9" font-size="18" font-weight="600">calls</text>
    </g>
    <g>
      <rect x="1140" y="236" width="96" height="36" rx="18" fill="#021a38" stroke="#7BA7D9" stroke-width="1.6"/>
      <text x="1188" y="260" text-anchor="middle" fill="#f4f6f9" font-size="18" font-weight="600">calls</text>
    </g>
    <g>
