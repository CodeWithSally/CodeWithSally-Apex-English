    </g>
    <text font-family="'Courier New', Courier, monospace" font-size="20">
      <tspan x="48" y="118" fill="#d2a8ff">@AuraEnabled</tspan>
      <tspan x="48" y="150" fill="#ffb86b">public void</tspan>
      <tspan fill="#79c0ff"> applyDiscount</tspan>
      <tspan fill="#f0f4f8">()</tspan>
    </text>

    <g filter="url(#scd-shadow)">
