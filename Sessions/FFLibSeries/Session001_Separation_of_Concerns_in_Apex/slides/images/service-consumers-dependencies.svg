      <tspan fill="#79c0ff"> List&lt;Opportunity&gt;</tspan>
      <tspan x="984" y="818" fill="#79c0ff">selectByIdWithProducts</tspan>
      <tspan fill="#f0f4f8">(</tspan>
      <tspan fill="#79c0ff">Set&lt;Id&gt;</tspan>
      <tspan fill="#f0f4f8"> ids)</tspan>
    </text>

