    <line x1="605" y1="192" x2="720" y2="340" stroke="#7BA7D9" stroke-width="3" marker-end="url(#scd-arrow)"/>
    <line x1="993" y1="192" x2="880" y2="340" stroke="#7BA7D9" stroke-width="3" marker-end="url(#scd-arrow)"/>
    <line x1="1381" y1="192" x2="1020" y2="340" stroke="#7BA7D9" stroke-width="3" marker-end="url(#scd-arrow)"/>

