    <text font-family="'Courier New', Courier, monospace" font-size="22">
      <tspan x="104" y="782" fill="#ffb86b">public void</tspan>
      <tspan x="104" y="818" fill="#79c0ff">applyDiscount</tspan>
      <tspan fill="#f0f4f8">(</tspan>
      <tspan fill="#79c0ff">Decimal</tspan>
      <tspan fill="#f0f4f8"> pct)</tspan>
