      <rect x="200" y="680" width="340" height="50" fill="url(#dcd-tab-domain)"/>
      <rect x="200" y="726" width="340" height="4" fill="#5A98E0"/>
      <rect x="218" y="694" width="18" height="18" rx="3" fill="#5A98E0"/>
      <text x="246" y="711" fill="#e6e6e6" font-size="22" font-weight="500">OpportunityLineItems.cls</text>
      <rect x="200" y="730" width="680" height="130" fill="#1e1e1e"/>
