      <text x="326" y="55" fill="#e6e6e6" font-size="22" font-weight="500">Service.cls</text>
      <rect x="280" y="74" width="480" height="118" fill="#1e1e1e"/>
    </g>
    <text font-family="'Courier New', Courier, monospace" font-size="22">
      <tspan x="300" y="122" fill="#ffb86b">public void</tspan>
      <tspan fill="#79c0ff"> applyDiscounts</tspan>
      <tspan x="300" y="154" fill="#f0f4f8">(</tspan>
      <tspan fill="#79c0ff">Set&lt;Id&gt;</tspan>
      <tspan fill="#f0f4f8"> ids, </tspan>
      <tspan fill="#79c0ff">Decimal</tspan>
      <tspan fill="#f0f4f8"> pct)</tspan>
    </text>

    <g filter="url(#dcd-shadow)">
      <rect x="840" y="24" width="560" height="50" fill="#252526"/>
      <rect x="840" y="24" width="248" height="50" fill="url(#dcd-tab-client)"/>
