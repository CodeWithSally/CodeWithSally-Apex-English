      <rect x="880" y="546" width="480" height="56" rx="8" fill="#ffe8a3" stroke="#c49216" stroke-width="2"/>
      <polygon points="1120,531 1132,547 1108,547" fill="#ffe8a3"/>
      <text x="1120" y="581" text-anchor="middle" fill="#3d2e00" font-size="18" font-weight="600">Optional Trigger logic sidecar class</text>
    </g>
    <g>
      <rect x="417" y="574" width="126" height="40" rx="20" fill="#021a38" stroke="#7BA7D9" stroke-width="1.6"/>
      <text x="480" y="601" text-anchor="middle" fill="#f4f6f9" font-size="20" font-weight="600">reuses</text>
    </g>
