      <text x="500" y="269" text-anchor="middle" fill="#f4f6f9" font-size="20" font-weight="600">calls</text>
    </g>
    <g>
      <rect x="715" y="242" width="110" height="40" rx="20" fill="#021a38" stroke="#7BA7D9" stroke-width="1.6"/>
      <text x="770" y="269" text-anchor="middle" fill="#f4f6f9" font-size="20" font-weight="600">calls</text>
    </g>
    <g>
      <rect x="1065" y="242" width="110" height="40" rx="20" fill="#021a38" stroke="#7BA7D9" stroke-width="1.6"/>
      <text x="1120" y="269" text-anchor="middle" fill="#f4f6f9" font-size="20" font-weight="600">calls</text>
    </g>
    <g>
