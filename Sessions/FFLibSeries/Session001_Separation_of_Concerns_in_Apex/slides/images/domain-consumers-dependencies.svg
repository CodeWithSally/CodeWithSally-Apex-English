      <rect x="840" y="340" width="460" height="50" fill="url(#dcd-tab-domain)"/>
      <rect x="840" y="386" width="460" height="4" fill="#5A98E0"/>
      <rect x="858" y="354" width="18" height="18" rx="3" fill="#5A98E0"/>
      <text x="886" y="371" fill="#e6e6e6" font-size="22" font-weight="500">OpportunitiesTriggerHandler.cls</text>
      <rect x="840" y="390" width="560" height="130" fill="#1e1e1e"/>
    </g>
    <text font-family="'Courier New', Courier, monospace" font-size="22">
      <tspan x="864" y="458" fill="#ffb86b">public void</tspan>
      <tspan fill="#79c0ff"> onBeforeInsert</tspan>
      <tspan fill="#f0f4f8">()</tspan>
    </text>

