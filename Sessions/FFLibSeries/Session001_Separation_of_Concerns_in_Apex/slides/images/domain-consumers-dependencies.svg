    <line x1="900" y1="192" x2="640" y2="340" stroke="#7BA7D9" stroke-width="3" marker-end="url(#dcd-arrow)"/>
    <line x1="1120" y1="192" x2="1120" y2="340" stroke="#7BA7D9" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#dcd-arrow)"/>
    <line x1="480" y1="520" x2="480" y2="680" stroke="#7BA7D9" stroke-width="3" marker-end="url(#dcd-arrow)"/>

    <g>
