<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="pdm-title">
  <title id="pdm-title">Salesforce package dependency map: Happy Soup depends on Business packages, which depend on Common packages, which depend on Framework packages; third-party extension and integration API packages sit beside the stack</title>
  <defs>
    <marker id="pdm-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,4 L 0,8 z" fill="#9fb3c8"/>
    </marker>
    <marker id="pdm-arrow-d" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,4 L 0,8 z" fill="#f3d36a"/>
    </marker>
    <filter id="pdm-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', system-ui, sans-serif; fill: #f4f6f9; }
    .box { font-size: 17px; font-weight: 500; }
    .small { font-size: 14px; fill: #9fb3c8; }
    .band { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
    .solid { fill: none; stroke: #9fb3c8; stroke-width: 2.5; marker-end: url(#pdm-arrow); }
    .dash { fill: none; stroke: #f3d36a; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#pdm-arrow-d); }
  </style>

  <!-- Happy Soup -->
  <rect x="610" y="14" width="380" height="56" rx="28" fill="rgba(159,179,200,0.10)" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="4 5"/>
  <text class="t box" x="800" y="48" text-anchor="middle">Remaining “Happy Soup” (unpackaged)</text>

  <!-- Business layer -->
  <rect x="330" y="108" width="940" height="172" rx="12" fill="rgba(160,201,74,0.08)" stroke="#A0C94A" stroke-width="2.5"/>
  <text class="t band" x="348" y="132" fill="#A0C94A" style="fill:#A0C94A">BUSINESS</text>
  <g filter="url(#pdm-shadow)" stroke-width="2">
    <rect x="350" y="144" width="200" height="46" rx="6" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="580" y="144" width="200" height="46" rx="6" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="810" y="144" width="200" height="46" rx="6" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="1040" y="144" width="200" height="46" rx="6" fill="#0b3a70" stroke="#A0C94A" stroke-dasharray="5 4"/>
    <rect x="350" y="212" width="200" height="46" rx="6" fill="rgba(160,201,74,0.30)" stroke="#A0C94A"/>
    <rect x="580" y="212" width="200" height="46" rx="6" fill="rgba(160,201,74,0.30)" stroke="#A0C94A"/>
    <rect x="810" y="212" width="200" height="46" rx="6" fill="rgba(210,168,255,0.30)" stroke="#d2a8ff"/>
    <rect x="1040" y="212" width="200" height="46" rx="6" fill="rgba(210,168,255,0.30)" stroke="#d2a8ff"/>
  </g>
  <text class="t box" x="450" y="173" text-anchor="middle">CRM</text>
  <text class="t box" x="680" y="173" text-anchor="middle">Marketing</text>
  <text class="t box" x="910" y="173" text-anchor="middle">Case / Service</text>
  <text class="t box" x="1140" y="173" text-anchor="middle">…more</text>
  <text class="t box" x="450" y="241" text-anchor="middle">Project XXX-A</text>
  <text class="t box" x="680" y="241" text-anchor="middle">Project XXX-B</text>
  <text class="t box" x="910" y="241" text-anchor="middle">Project YYY-A</text>
  <text class="t box" x="1140" y="241" text-anchor="middle">Project YYY-B</text>

  <!-- Common layer -->
  <rect x="380" y="328" width="840" height="332" rx="12" fill="rgba(90,152,224,0.10)" stroke="#5A98E0" stroke-width="2.5"/>
  <text class="t band" x="398" y="352" style="fill:#8fb3ff">COMMON</text>
  <g filter="url(#pdm-shadow)" stroke-width="2">
    <rect x="420" y="368" width="220" height="52" rx="6" fill="rgba(160,201,74,0.30)" stroke="#A0C94A"/>
    <rect x="690" y="368" width="220" height="52" rx="6" fill="rgba(210,168,255,0.30)" stroke="#d2a8ff"/>
    <rect x="960" y="368" width="220" height="52" rx="6" fill="rgba(255,138,122,0.28)" stroke="#ff8a7a"/>
    <rect x="420" y="450" width="500" height="72" rx="6" fill="rgba(90,152,224,0.35)" stroke="#5A98E0"/>
    <rect x="420" y="560" width="760" height="76" rx="6" fill="rgba(90,152,224,0.18)" stroke="#5A98E0" stroke-dasharray="7 5"/>
  </g>
  <text class="t box" x="530" y="400" text-anchor="middle">Project XXX Common</text>
  <text class="t box" x="800" y="400" text-anchor="middle">Project YYY Common</text>
  <text class="t box" x="1070" y="400" text-anchor="middle">BackOffice Common</text>
  <text class="t box" x="670" y="482" text-anchor="middle">Org-wide Common</text>
  <text class="t small" x="670" y="506" text-anchor="middle">Core SObject concerns for this org</text>
  <text class="t box" x="800" y="592" text-anchor="middle">Universal Common</text>
  <text class="t small" x="800" y="616" text-anchor="middle">Core SObject concerns shared by every org · in a single org, this lives in Org-wide Common</text>

  <!-- Framework layer -->
  <rect x="380" y="698" width="840" height="188" rx="12" fill="rgba(129,204,194,0.08)" stroke="#81ccc2" stroke-width="2.5"/>
  <text class="t band" x="398" y="722" style="fill:#81ccc2">FRAMEWORK</text>
  <rect x="610" y="734" width="590" height="140" rx="8" fill="none" stroke="#81ccc2" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t small" x="1188" y="754" text-anchor="end" style="fill:#81ccc2">Apex Enterprise Patterns</text>
  <g filter="url(#pdm-shadow)" stroke-width="2">
    <rect x="410" y="736" width="170" height="40" rx="6" fill="#0b3a70" stroke="#81ccc2"/>
    <rect x="410" y="786" width="170" height="40" rx="6" fill="#0b3a70" stroke="#81ccc2"/>
    <rect x="410" y="836" width="170" height="40" rx="6" fill="#0b3a70" stroke="#81ccc2"/>
    <rect x="640" y="758" width="170" height="44" rx="6" fill="rgba(129,204,194,0.35)" stroke="#81ccc2"/>
    <rect x="640" y="820" width="170" height="44" rx="6" fill="rgba(129,204,194,0.35)" stroke="#81ccc2"/>
    <rect x="840" y="820" width="150" height="44" rx="6" fill="rgba(129,204,194,0.35)" stroke="#81ccc2"/>
    <rect x="1020" y="820" width="165" height="44" rx="6" fill="rgba(129,204,194,0.35)" stroke="#81ccc2"/>
