  <text class="t box" x="495" y="762" text-anchor="middle">Utils</text>
  <text class="t box" x="495" y="812" text-anchor="middle">Promises</text>
  <text class="t box" x="495" y="862" text-anchor="middle">Other libraries</text>
  <text class="t box" x="725" y="786" text-anchor="middle">AT4DX</text>
  <text class="t box" x="725" y="848" text-anchor="middle">fflib Apex Common</text>
  <text class="t box" x="915" y="848" text-anchor="middle">Force-DI</text>
  <text class="t box" x="1102" y="848" text-anchor="middle">fflib Apex Mocks</text>

  <!-- Third-party -->
  <rect x="20" y="328" width="300" height="152" rx="12" fill="rgba(159,179,200,0.08)" stroke="#9fb3c8" stroke-width="2.5"/>
  <text class="t band" x="36" y="352" style="fill:#9fb3c8;font-size:13px">THIRD-PARTY EXTENSIONS</text>
  <rect x="20" y="518" width="300" height="152" rx="12" fill="rgba(159,179,200,0.05)" stroke="#9fb3c8" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="t band" x="36" y="542" style="fill:#9fb3c8;font-size:13px">THIRD-PARTY MANAGED PACKAGES</text>
  <g filter="url(#pdm-shadow)" stroke-width="2" fill="#0b3a70" stroke="#9fb3c8">
    <rect x="38" y="370" width="128" height="40" rx="6"/><rect x="176" y="370" width="128" height="40" rx="6"/>
    <rect x="38" y="422" width="128" height="40" rx="6"/><rect x="176" y="422" width="128" height="40" rx="6"/>
    <rect x="38" y="560" width="128" height="40" rx="6"/><rect x="176" y="560" width="128" height="40" rx="6"/>
    <rect x="38" y="612" width="128" height="40" rx="6"/><rect x="176" y="612" width="128" height="40" rx="6"/>
  </g>
  <g class="t" style="font-size:15px" text-anchor="middle">
    <text x="102" y="396">DocuSignExt</text><text x="240" y="396">SpringCMExt</text>
    <text x="102" y="448">ASCENTExt</text><text x="240" y="448">PSAExt</text>
    <text x="102" y="586">DocuSign</text><text x="240" y="586">SpringCM</text>
    <text x="102" y="638">ASCENT</text><text x="240" y="638">PSA</text>
  </g>

  <!-- Integration APIs -->
  <rect x="1300" y="108" width="280" height="172" rx="12" fill="rgba(232,168,74,0.08)" stroke="#E8A84A" stroke-width="2.5"/>
  <text class="t band" x="1316" y="132" style="fill:#E8A84A;font-size:13px">INBOUND INTEGRATION API</text>
  <rect x="1300" y="398" width="280" height="172" rx="12" fill="rgba(232,168,74,0.08)" stroke="#E8A84A" stroke-width="2.5"/>
