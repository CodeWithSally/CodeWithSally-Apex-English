<g filter="url(#pdm-shadow)" stroke-width="2" fill="#0b3a70" stroke="#9fb3c8"><rect x="38" y="612" width="128" height="40" rx="6"/><rect x="176" y="612" width="128" height="40" rx="6"/></g>
<g class="t" style="font-size:15px" text-anchor="middle"><text x="102" y="586">DocuSign</text><text x="240" y="586">SpringCM</text></g>
