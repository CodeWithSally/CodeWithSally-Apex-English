<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="mer-title">
  <title id="mer-title">Meridian's packages on the layer map, with each package's prefix</title>
  <defs>
    <marker id="mer-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,4 L 0,8 z" fill="#9fb3c8"/>
    </marker>
    <filter id="mer-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', system-ui, sans-serif; fill: #f4f6f9; }
    .name { font-size: 24px; font-weight: 600; }
    .pfx { font-family: 'Cascadia Code', 'Consolas', ui-monospace, monospace; font-size: 21px; fill: #f3d36a; }
    .small { font-size: 16px; fill: #9fb3c8; }
    .band { font-size: 17px; font-weight: 700; letter-spacing: 1.5px; }
    .solid { fill: none; stroke: #9fb3c8; stroke-width: 2.5; marker-end: url(#mer-arrow); }
  </style>

  <!-- Business -->
  <rect x="40" y="40" width="1260" height="210" rx="12" fill="rgba(160,201,74,0.08)" stroke="#A0C94A" stroke-width="2.5"/>
  <text class="t band" x="60" y="140" style="fill:#A0C94A">BUSINESS</text>
  <text class="t small" x="60" y="164">One per division</text>
  <text class="t small" x="60" y="184">or project</text>
  <rect x="838" y="72" width="450" height="164" rx="10" fill="none" stroke="#A0C94A" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t small" x="1063" y="96" text-anchor="middle" style="fill:#A0C94A">Meridian Fulfillment · warehouse project</text>
  <g filter="url(#mer-shadow)" stroke-width="2">
    <rect x="215" y="90" width="195" height="120" rx="8" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="425" y="90" width="195" height="120" rx="8" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="635" y="90" width="195" height="120" rx="8" fill="#0b3a70" stroke="#A0C94A"/>
    <rect x="850" y="112" width="205" height="104" rx="8" fill="rgba(160,201,74,0.30)" stroke="#A0C94A"/>
    <rect x="1070" y="112" width="205" height="104" rx="8" fill="rgba(160,201,74,0.30)" stroke="#A0C94A"/>
  </g>
  <g class="t" text-anchor="middle">
    <text class="name" x="312" y="132">sales</text><text class="pfx" x="312" y="162">SALES_</text><text class="small" x="312" y="190">CRM · consultancy</text>
    <text class="name" x="522" y="132">service</text><text class="pfx" x="522" y="162">SVC_</text><text class="small" x="522" y="190">Cases · 2nd vendor</text>
    <text class="name" x="732" y="132">marketing</text><text class="pfx" x="732" y="162">MKTG_</text><text class="small" x="732" y="190">Campaigns · in-house</text>
    <text class="name" x="952" y="154">fulfillment</text><text class="pfx" x="952" y="186">FUL_</text>
    <text class="name" x="1172" y="154">maintenance</text><text class="pfx" x="1172" y="186">MNT_</text>
  </g>

  <!-- Project Common -->
  <rect x="40" y="300" width="1260" height="150" rx="12" fill="rgba(90,152,224,0.06)" stroke="#5A98E0" stroke-width="2.5"/>
  <text class="t band" x="60" y="362" style="fill:#8fb3ff">PROJECT</text>
  <text class="t band" x="60" y="384" style="fill:#8fb3ff">COMMON</text>
  <text class="t small" x="60" y="408">One project only</text>
  <rect x="902" y="336" width="320" height="94" rx="8" fill="rgba(90,152,224,0.22)" stroke="#5A98E0" stroke-width="2" filter="url(#mer-shadow)"/>
  <g class="t" text-anchor="middle">
    <text class="name" x="1062" y="370">warehouse-common</text><text class="pfx" x="1062" y="398">WHSE_</text>
    <text class="small" x="1062" y="420">Robots · WHSE_IMaintenanceService</text>
  </g>

  <!-- Org-wide Common -->
  <rect x="40" y="500" width="1260" height="160" rx="12" fill="rgba(90,152,224,0.10)" stroke="#5A98E0" stroke-width="2.5"/>
  <text class="t band" x="60" y="570" style="fill:#8fb3ff">ORG-WIDE</text>
  <text class="t band" x="60" y="592" style="fill:#8fb3ff">COMMON</text>
  <rect x="215" y="540" width="880" height="100" rx="8" fill="rgba(90,152,224,0.35)" stroke="#5A98E0" stroke-width="2" filter="url(#mer-shadow)"/>
  <g class="t" text-anchor="middle">
    <text class="name" x="655" y="576">common <tspan class="pfx" dx="10">CMN_</tspan></text>
    <text class="small" x="655" y="604">Account · Contact · Case · Product2 · their one Selector and one Domain</text>
    <text class="small" x="655" y="626">Shared contracts such as CMN_IOrderFulfillmentService</text>
  </g>

  <!-- Framework -->
  <rect x="40" y="710" width="1260" height="160" rx="12" fill="rgba(129,204,194,0.08)" stroke="#81ccc2" stroke-width="2.5"/>
  <text class="t band" x="60" y="780" style="fill:#81ccc2">FRAMEWORK</text>
  <text class="t small" x="60" y="804">No company</text>
  <text class="t small" x="60" y="824">schema</text>
  <g filter="url(#mer-shadow)" stroke-width="2" fill="rgba(129,204,194,0.30)" stroke="#81ccc2">
    <rect x="215" y="760" width="245" height="70" rx="8"/>
    <rect x="480" y="760" width="245" height="70" rx="8"/>
    <rect x="745" y="760" width="245" height="70" rx="8"/>
    <rect x="1010" y="760" width="245" height="70" rx="8"/>
  </g>
  <g class="t" text-anchor="middle">
    <text class="name" x="337" y="791" style="font-size:21px">fflib Apex Common</text><text class="pfx" x="337" y="818" style="font-size:18px">fflib_</text>
    <text class="name" x="602" y="791" style="font-size:21px">fflib Apex Mocks</text><text class="pfx" x="602" y="818" style="font-size:18px">fflib_</text>
    <text class="name" x="867" y="791" style="font-size:21px">force-di</text><text class="pfx" x="867" y="818" style="font-size:18px">di_</text>
    <text class="name" x="1132" y="802" style="font-size:21px">AT4DX</text>
  </g>

  <!-- Integration -->
  <rect x="1330" y="300" width="250" height="360" rx="12" fill="rgba(232,168,74,0.08)" stroke="#E8A84A" stroke-width="2.5"/>
  <text class="t band" x="1350" y="332" style="fill:#E8A84A;font-size:15px">INTEGRATION API</text>
  <g filter="url(#mer-shadow)" stroke-width="2" fill="#0b3a70" stroke="#E8A84A">
    <rect x="1360" y="360" width="190" height="104" rx="8"/>
    <rect x="1360" y="500" width="190" height="104" rx="8"/>
  </g>
  <g class="t" text-anchor="middle">
    <text class="name" x="1455" y="394" style="font-size:22px">erp-inbound</text><text class="pfx" x="1455" y="422">ERP_</text><text class="small" x="1455" y="448">Products, stock in</text>
    <text class="name" x="1455" y="534" style="font-size:20px">carrier-outbound</text><text class="pfx" x="1455" y="562">CARR_</text><text class="small" x="1455" y="588">Shipments out</text>
  </g>

  <!-- Dependencies point down -->
  <path class="solid" d="M312 210 V537"/>
  <path class="solid" d="M522 210 V537"/>
  <path class="solid" d="M732 210 V537"/>
  <path class="solid" d="M952 216 V333"/>
  <path class="solid" d="M1172 216 V333"/>
  <path class="solid" d="M1062 430 V537"/>
  <path class="solid" d="M655 640 V707"/>
  <path class="solid" d="M1360 412 H1316 V590 H1098"/>
  <path class="solid" d="M1360 552 H1316"/>
</svg>
