<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="selcd-title">
  <title id="selcd-title">Service, Domain, Controller, and Batch call OpportunitiesSelector; Selector returns OpportunitySummary</title>
  <defs>
