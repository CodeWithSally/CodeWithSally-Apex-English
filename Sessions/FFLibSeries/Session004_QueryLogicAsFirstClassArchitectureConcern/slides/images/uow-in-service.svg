<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="uow-title">
  <title id="uow-title">Service method entry creates a Unit of Work, registers changes, commits once, then exits</title>
  <defs>
    <linearGradient id="uow-tab" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0.52" stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#A0C94A" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="uow-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4a1c"/>
      <stop offset="1" stop-color="#2a3314"/>
    </linearGradient>
    <linearGradient id="uow-cyl-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BA3E0"/>
      <stop offset="1" stop-color="#2E6BB0"/>
    </linearGradient>
    <filter id="uow-shadow" x="-6%" y="-8%" width="112%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="uow-arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,4 L 0,8 z" fill="#7BA7D9"/>
    </marker>
  </defs>

  <g filter="url(#uow-shadow)">
    <rect x="24" y="16" width="1552" height="52" fill="#252526"/>
    <rect x="24" y="16" width="280" height="52" fill="url(#uow-tab)"/>
    <rect x="24" y="64" width="280" height="4" fill="#A0C94A"/>
    <rect x="42" y="30" width="18" height="18" rx="3" fill="#A0C94A"/>
    <text x="70" y="47" fill="#e6e6e6" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="500">Service.cls</text>
    <rect x="24" y="68" width="1552" height="816" fill="#1e1e1e"/>
  </g>

  <g filter="url(#uow-shadow)">
    <rect x="200" y="88" width="1200" height="64" rx="6" fill="url(#uow-bar)" stroke="#A0C94A" stroke-width="2"/>
  </g>
  <text x="800" y="132" text-anchor="middle" fill="#A0C94A" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="700">Service Method Entry ...</text>

  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="248" y="192" fill="#ffb86b">public static void</tspan>
    <tspan fill="#79c0ff"> doSomeStuff</tspan>
    <tspan fill="#f0f4f8">(...) {</tspan>
  </text>

  <text x="320" y="256" fill="#e6e6e6" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700">Create a Unit of Work</text>
  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="320" y="302" fill="#f0f4f8">uow = </tspan>
    <tspan fill="#ffb86b">new</tspan>
    <tspan fill="#79c0ff"> fflib_SObjectUnitOfWork</tspan>
  </text>

  <text x="400" y="378" fill="#e6e6e6" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700">Do work, register record changes</text>

  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="400" y="456" fill="#f0f4f8">uow.</tspan><tspan fill="#79c0ff">registerDirty</tspan>
  </text>
  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="400" y="508" fill="#f0f4f8">uow.</tspan><tspan fill="#79c0ff">registerNew</tspan>
  </text>
  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="400" y="560" fill="#f0f4f8">uow.</tspan><tspan fill="#79c0ff">registerDelete</tspan>
  </text>

  <text x="320" y="684" fill="#e6e6e6" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700">Commit a Unit of Work</text>
  <text font-family="Courier New, Courier, monospace" font-size="28">
    <tspan x="320" y="732" fill="#f0f4f8">uow.</tspan><tspan fill="#79c0ff">commitWork</tspan>
  </text>

  <g transform="translate(928, 618)">
    <ellipse cx="164" cy="116" rx="164" ry="34" fill="#245A96"/>
    <rect x="0" y="34" width="328" height="82" fill="url(#uow-cyl-side)"/>
    <ellipse cx="164" cy="34" rx="164" ry="34" fill="#7EB6EA"/>
    <ellipse cx="164" cy="34" rx="164" ry="21" fill="#A8D0F5"/>
    <g transform="translate(22, 48) scale(1.25)">
      <circle cx="11" cy="10" r="11" fill="#A0C94A"/>
      <path d="M6 10 l3.2 3.4 7-7" fill="none" stroke="#1e1e1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="16" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Bulkified</text>
    </g>
    <g transform="translate(22, 86) scale(1.25)">
      <circle cx="11" cy="10" r="11" fill="#A0C94A"/>
      <path d="M6 10 l3.2 3.4 7-7" fill="none" stroke="#1e1e1e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="16" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Secure by default</text>
    </g>
  </g>

  <line x1="620" y1="724" x2="868" y2="724" stroke="#7BA7D9" stroke-width="4"/>
  <path d="M 868,714 L 898,724 L 868,734 z" fill="#7BA7D9"/>

  <g filter="url(#uow-shadow)">
    <rect x="200" y="800" width="1200" height="64" rx="6" fill="url(#uow-bar)" stroke="#A0C94A" stroke-width="2"/>
  </g>
  <text x="248" y="788" fill="#f0f4f8" font-family="Courier New, Courier, monospace" font-size="28">}</text>
  <text x="800" y="844" text-anchor="middle" fill="#A0C94A" font-family="Segoe UI, system-ui, sans-serif" font-size="34" font-weight="700">... Service Method Exit</text>

  <path d="M 292,120 H 208 C 128,120 118,136 118,200 V 430 C 118,460 78,476 78,476 C 118,492 118,522 118,552 V 752 C 118,816 128,832 208,832 H 292" fill="none" stroke="#5A98E0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1308,120 H 1392 C 1472,120 1482,136 1482,200 V 430 C 1482,460 1522,476 1522,476 C 1482,492 1482,522 1482,552 V 752 C 1482,816 1472,832 1392,832 H 1308" fill="none" stroke="#5A98E0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 282,222 H 262 C 198,222 188,236 188,276 V 430 C 188,456 158,475 158,475 C 188,494 188,520 188,546 V 720 C 188,748 198,760 262,760 H 282" fill="none" stroke="#7BA7D9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1318,222 H 1338 C 1402,222 1412,236 1412,276 V 430 C 1412,456 1442,475 1442,475 C 1412,494 1412,520 1412,546 V 720 C 1412,748 1402,760 1338,760 H 1318" fill="none" stroke="#7BA7D9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 388,404 H 348 C 310,404 302,414 302,436 V 478 C 302,496 282,511 282,511 C 302,526 302,544 302,562 V 598 C 302,616 310,624 348,624 H 388" fill="none" stroke="#7BA7D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 720,404 H 760 C 798,404 806,414 806,436 V 478 C 806,496 826,511 826,511 C 806,526 806,544 806,562 V 598 C 806,616 798,624 760,624 H 720" fill="none" stroke="#7BA7D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
