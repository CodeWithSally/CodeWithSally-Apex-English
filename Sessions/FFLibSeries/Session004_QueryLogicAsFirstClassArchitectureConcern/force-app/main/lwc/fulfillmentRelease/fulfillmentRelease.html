<template>
	<lightning-quick-action-panel header="Release Order">
		<lightning-record-view-form record-id={recordId} object-api-name="FulfillmentOrder__c">
			<div class="slds-grid slds-wrap slds-gutters">
				<div class="slds-col slds-size_1-of-2">
					<lightning-output-field field-name="Name"></lightning-output-field>
				</div>
				<div class="slds-col slds-size_1-of-2">
					<lightning-output-field field-name="Warehouse__c"></lightning-output-field>
				</div>
				<div class="slds-col slds-size_1-of-2">
					<lightning-output-field field-name="Status__c"></lightning-output-field>
				</div>
			</div>
		</lightning-record-view-form>
		<p class="slds-m-top_medium">
			Release this draft order so dispatch can assign robots to its lines.
		</p>
		<div slot="footer">
			<lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
			<lightning-button
				variant="brand"
				class="slds-m-left_x-small"
				label="Release"
				onclick={handleRelease}
				disabled={isSaving}
			></lightning-button>
		</div>
	</lightning-quick-action-panel>
</template>
