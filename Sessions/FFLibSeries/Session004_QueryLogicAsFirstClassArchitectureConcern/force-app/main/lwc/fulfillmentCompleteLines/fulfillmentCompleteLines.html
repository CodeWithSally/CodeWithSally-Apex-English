<template>
	<lightning-quick-action-panel header="Complete Assigned Lines">
		<lightning-record-view-form record-id={recordId} object-api-name="FulfillmentOrder__c">
			<lightning-output-field field-name="Name"></lightning-output-field>
			<lightning-output-field field-name="Status__c"></lightning-output-field>
		</lightning-record-view-form>
		<p class="slds-m-top_medium">
			Complete every assigned line on this order. Robots return to idle and wear is applied.
			Robots that are then due for service are scheduled by the maintenance process.
		</p>
		<div slot="footer">
			<lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
			<lightning-button
				variant="brand"
				class="slds-m-left_x-small"
				label="Complete Lines"
				onclick={handleComplete}
				disabled={isSaving}
			></lightning-button>
		</div>
	</lightning-quick-action-panel>
</template>
