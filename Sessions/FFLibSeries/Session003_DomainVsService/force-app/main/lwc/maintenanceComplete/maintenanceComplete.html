<template>
	<lightning-quick-action-panel header="Complete Maintenance">
		<lightning-record-view-form record-id={recordId} object-api-name="MaintenanceJob__c">
			<lightning-output-field field-name="Name"></lightning-output-field>
			<lightning-output-field field-name="Robot__c"></lightning-output-field>
			<lightning-output-field field-name="Status__c"></lightning-output-field>
		</lightning-record-view-form>
		<p class="slds-m-top_medium">
			Complete this job and return the robot to idle with wear cleared.
		</p>
		<div slot="footer">
			<lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
			<lightning-button
				variant="brand"
				class="slds-m-left_x-small"
				label="Complete Maintenance"
				onclick={handleComplete}
				disabled={isSaving}
			></lightning-button>
		</div>
	</lightning-quick-action-panel>
</template>
