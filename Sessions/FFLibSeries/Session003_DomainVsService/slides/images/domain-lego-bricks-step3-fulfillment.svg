      <rect x="910" y="90" width="620" height="150" fill="#1e1e1e"/>
    </g>
    <text font-family="'Courier New', Courier, monospace" font-size="19">
      <tspan x="934" y="132" fill="#ffb86b">public void</tspan>
      <tspan fill="#79c0ff"> completeLines</tspan>
