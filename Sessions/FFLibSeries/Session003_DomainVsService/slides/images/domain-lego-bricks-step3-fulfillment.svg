<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="lego3-title">
  <title id="lego3-title">FulfillmentService.completeLines calling Robots, FulfillmentLines, and FulfillmentOrders</title>
  <defs>
